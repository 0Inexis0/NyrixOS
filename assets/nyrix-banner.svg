<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">NyrixOS</title>
  <desc id="desc">A folded mint and lavender N floats over orbital rings on a midnight-blue background.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#101521"/><stop offset="1" stop-color="#212544"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#736dbd" stop-opacity=".45"/><stop offset="1" stop-color="#736dbd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fold" x2="0.85" y2="1">
      <stop stop-color="#bdfff0"/><stop offset=".47" stop-color="#93d9e4"/><stop offset="1" stop-color="#aea1ff"/>
    </linearGradient>
    <pattern id="stars" width="74" height="74" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#a6b3d5" opacity=".25"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#sky)"/>
  <rect width="1200" height="340" rx="20" fill="url(#stars)"/>
  <ellipse cx="910" cy="165" rx="285" ry="165" fill="url(#glow)"/>
  <g transform="rotate(-19 910 170)" fill="none" stroke="#98a9d7">
    <ellipse cx="910" cy="170" rx="237" ry="107" opacity=".38"/>
    <ellipse cx="910" cy="170" rx="255" ry="121" opacity=".21"/>
    <ellipse cx="910" cy="170" rx="271" ry="136" opacity=".1"/>
    <circle cx="673" cy="170" r="4" fill="#c5ffef" stroke="none"/>
  </g>
  <g transform="translate(817 78)">
    <path d="M0 184 42 0h50L50 184Z" fill="#93e2d7"/>
    <path d="M121 184 163 0h50l-42 184Z" fill="#ada3fa"/>
    <path d="M42 0h50l79 184h-50Z" fill="url(#fold)"/>
  </g>
  <text x="65" y="192" fill="#f4f6ff" font-family="DejaVu Sans, sans-serif" font-size="102" font-weight="bold" letter-spacing="-6">Nyrix<tspan fill="#a7ede1">OS</tspan></text>
  <text x="71" y="242" fill="#c7cfe3" font-family="DejaVu Sans, sans-serif" font-size="29">Arch Linux + Hyprland</text>
</svg>
